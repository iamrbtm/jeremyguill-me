name: Publish one-page site

on:
  push:
    branches: [main]
    paths: ["one_page/index.html"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Check one-page build
        run: sh scripts/check_one_page.sh

      - name: Checkout Pages repo
        uses: actions/checkout@v4
        with:
          repository: iamrbtm/iamrbtm.github.io
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: pages-repo

      - name: Copy index.html only
        run: |
          set -euo pipefail
          cp one_page/index.html pages-repo/index.html

      - name: Commit and push
        working-directory: pages-repo
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish one-page site from ${GITHUB_SHA::7}"
          git push
