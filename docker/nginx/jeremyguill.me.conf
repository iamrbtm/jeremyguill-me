server {
    listen 80;
    server_name jeremyguill.me www.jeremyguill.me;

    client_max_body_size 15m;

    location ~ /\. {
        deny all;
    }

    location /static/ {
        alias /srv/jeremyguill-me/shared/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/jeremyguill-me/shared/media/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 443 ssl http2;
    server_name jeremyguill.me www.jeremyguill.me;

    ssl_certificate /etc/letsencrypt/live/jeremyguill.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeremyguill.me/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 15m;

    location ~ /\. {
        deny all;
    }

    location /static/ {
        alias /srv/jeremyguill-me/shared/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/jeremyguill-me/shared/media/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
