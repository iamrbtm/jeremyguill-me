services:
  web:
    build: .
    image: jeremyguill-portfolio:local
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-development-only-secret}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://portfolio:development-only-postgres-password@db:5432/portfolio}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://jeremyguill.me}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-jeremyguill.me}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_FALLBACK_BASE_URL: ${OPENAI_FALLBACK_BASE_URL:-http://127.0.0.1:11434/v1}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-qwen2.5-coder:0.5b}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      SEED_INITIAL_CONTENT: ${SEED_INITIAL_CONTENT:-1}
      ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL:-}
      ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID:-}
    ports:
      - "7777:7777"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - media_data:/app/var/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - nginx-proxy-manager_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7777/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  worker:
    image: jeremyguill-portfolio:local
    build: .
    command: ["python", "-m", "portfolio.worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('db',5432),timeout=3); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-development-only-secret}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://portfolio:development-only-postgres-password@db:5432/portfolio}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://jeremyguill.me}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-jeremyguill.me}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_FALLBACK_BASE_URL: ${OPENAI_FALLBACK_BASE_URL:-http://127.0.0.1:11434/v1}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-qwen2.5-coder:0.5b}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - media_data:/app/var/media
    networks:
      - default
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U portfolio -d portfolio && psql -U portfolio -d portfolio -c "select 1" >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  analytics:
    image: ghcr.io/umami-software/umami:postgresql-v2.20.2
    profiles: ["analytics"]
    # Refuse to start with a missing/short secret or DB password (image default CMD is `pnpm start-docker`).
    command:
      - sh
      - -c
      - '[ "$${#APP_SECRET}" -ge 32 ] && [ -n "$${UMAMI_DB_PASSWORD}" ] || { echo "set UMAMI_APP_SECRET and UMAMI_DB_PASSWORD in .env (openssl rand -hex 32)" >&2; exit 1; }; exec pnpm start-docker'
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-}
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - nginx-proxy-manager_default
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-postgres-password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/source/media:ro
      - backup_data:/backups
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"

volumes:
  postgres_data:
  media_data:
  backup_data:

networks:
  default:
    internal: false
  nginx-proxy-manager_default:
    external: true
