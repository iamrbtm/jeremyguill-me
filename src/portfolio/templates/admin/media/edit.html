<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Media</title>
  </head>
  <body>
    <main>
      <h1>Edit Media</h1>
      <form method="post">
        <label>
          Alt text
          <input name="alt_text" value="{{ asset.alt_text }}" maxlength="240" required>
        </label>
        <label>
          Caption
          <textarea name="caption">{{ asset.caption }}</textarea>
        </label>
        <button type="submit">Save media</button>
      </form>
    </main>
  </body>
</html>
