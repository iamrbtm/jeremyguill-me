<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Jeremy Guill{% endblock %}</title>
    {% if metadata %}{% include "components/metadata.html" %}{% endif %}
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/site.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include "components/navigation.html" %}
    <main id="main" class="site-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div>
        <p class="site-footer__title">Jeremy Guill</p>
        <p>Practical software, database workflows, and implementation support for work that has to get done.</p>
      </div>
      <a class="footer-link" href="/contact">Start a conversation</a>
    </footer>
  </body>
</html>
