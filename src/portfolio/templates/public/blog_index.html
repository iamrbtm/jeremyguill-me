{% extends "public/base.html" %}
{% block title %}Blog | Jeremy Guill{% endblock %}
{% block content %}
<section class="page-section">
  <p class="eyebrow">Blog</p>
  <h1>Notes on practical software work.</h1>
  {% for post in posts %}
    <article class="timeline-item">
      <h2><a href="{{ url_for('blog.detail', slug=post.slug) }}">{{ post.title }}</a></h2>
      <p>{{ post.summary }}</p>
    </article>
  {% else %}
    <p>No posts are published yet.</p>
  {% endfor %}
</section>
{% endblock %}
