[project]
name = "jeremyguill-portfolio"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
description = "Professional portfolio and CMS for Jeremy Guill"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jeremy Guill", email = "jeremy@jeremyguill.me" }
]
keywords = ["portfolio", "flask", "postgresql", "cms"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: Flask",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Migrate>=4,<5",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
    "webauthn>=2.2,<3",
    "Flask-WTF>=1.2,<2",
    "Flask-Limiter>=3.12,<4",
    "cryptography>=48.0.1,<49",
    "httpx>=0.28,<1",
    "markdown-it-py>=3,<4",
    "nh3>=0.3,<1",
    "Pillow>=12.3,<13",
    "filetype>=1.2,<2",
    "pyOpenSSL>=26,<27",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2,<7",
    "pytest-postgresql>=7,<8",
    "mypy>=1.17,<2",
    "ruff>=0.12,<1",
    "playwright>=1.54,<2",
    "pip-audit>=2.9,<3",
    "respx>=0.22,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "Q", "W"]
ignore = []

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "import-untyped",
    "name-defined",
    "no-any-return",
    "return-value",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]
